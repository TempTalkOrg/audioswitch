apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
apply plugin: 'signing'
apply plugin: 'kotlin-android'
apply plugin: "org.jetbrains.dokka"

android {
    compileSdkVersion 31
    namespace "com.twilio.audioswitch"

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 31
        buildConfigField("String", "VERSION_NAME",
                "\"${audioSwitchVersion}\"")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    testOptions {
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
        // Looper/Handler are only used to pick the thread work runs on; letting the android.jar stubs
        // return defaults makes the tests' mock handlers take over instead of throwing.
        unitTests.returnDefaultValues = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    dokkaHtml.configure {
        dokkaSourceSets {
            named("main") {
                noAndroidSdkLink.set(false)
                includeNonPublic = false
                reportUndocumented = true
                skipEmptyPackages = true
            }
        }
    }
}

// Java tests that call Kotlin `internal` members rely on JVM-mangled names (e.g. getContext$audioswitch_debug).
// Pin the module name so those names stay stable across Kotlin/AGP defaults.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { task ->
    if (task.name.contains("UnitTest")) {
        task.kotlinOptions.freeCompilerArgs += ["-module-name", "audioswitch_debug"]
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.3.0"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.nhaarman.mockitokotlin2:mockito-kotlin:2.2.0'
    // mockito-kotlin 2.2.0 pulls mockito-core 2.23/byte-buddy 1.9, whose ClassReader cannot read
    // JDK 17's java.lang.Object (class major 61), so the inline mock maker fails on every mock.
    testImplementation 'org.mockito:mockito-core:3.12.4'
    testImplementation 'net.bytebuddy:byte-buddy:1.14.19'
    testImplementation 'net.bytebuddy:byte-buddy-agent:1.14.19'
    testImplementation 'pl.pragmatists:JUnitParams:1.1.1'
    def androidXTest = '1.4.1-alpha03'
    androidTestUtil "androidx.test:orchestrator:$androidXTest"
    androidTestImplementation "androidx.test:runner:$androidXTest"
    androidTestImplementation "androidx.test:rules:$androidXTest"
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
}

def audioSwitchGroupId = 'org.difft.android.libraries'
def audioSwitchArtifactId = 'audioswitch'

afterEvaluate {
    publishing {
        publications {
            audioSwitchRelease(MavenPublication) {
                from components.release

                groupId = audioSwitchGroupId
                artifactId = audioSwitchArtifactId
                version = audioSwitchVersion

                pom {
                    name = 'Audioswitch'
                    description = 'An Android audio management library for real-time communication apps.'
                    url = 'https://github.com/twilio/audioswitch'
                    licenses {
                        license {
                            name = 'Apache 2.0'
                            url = 'https://github.com/twilio/audioswitch/blob/master/LICENSE.txt'
                        }
                    }
                    developers {
                        developer {
                            id = 'Twilio'
                            name = 'Twilio'
                        }
                    }
                    scm {
                        connection = 'scm:git:github.com/twilio/audioswitch.git'
                        developerConnection = 'scm:git:ssh://github.com/twilio/audioswitch.git'
                        url = 'https://github.com/twilio/audioswitch/tree/main'
                    }
                }
            }
        }
    }
}
